<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 820" width="100%" height="100%" class="janashakti-map" id="riverNetworkMap">
  <defs>
    <!-- Filter effects for glow and soft shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>

    <!-- Linear Gradients for Rivers -->
    <linearGradient id="gangaGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="yamunaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="peninsularGrad" x1="0%" y1="0%" x2="100%" y2="30%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
  </defs>

  <!-- Background Base styling -->
  <rect width="100%" height="100%" fill="#091421" rx="12" />

  <!-- Grid overlay for geospatial feel -->
  <g stroke="#1e293b" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.6">
    <line x1="80" y1="50" x2="80" y2="780" />
    <line x1="200" y1="50" x2="200" y2="780" />
    <line x1="320" y1="50" x2="320" y2="780" />
    <line x1="440" y1="50" x2="440" y2="780" />
    <line x1="560" y1="50" x2="560" y2="780" />
    <line x1="680" y1="50" x2="680" y2="780" />
    <line x1="800" y1="50" x2="800" y2="780" />

    <line x1="50" y1="120" x2="900" y2="120" />
    <line x1="50" y1="240" x2="900" y2="240" />
    <line x1="50" y1="360" x2="900" y2="360" />
    <line x1="50" y1="480" x2="900" y2="480" />
    <line x1="50" y1="600" x2="900" y2="600" />
    <line x1="50" y1="720" x2="900" y2="720" />
  </g>

  <!-- Stylized Landmass & Basin Polygons -->
  <path d="M 240,70 L 370,60 L 480,90 L 580,120 L 760,110 L 880,160 L 890,260 L 830,310 L 710,300 L 640,360 L 590,460 L 540,580 L 460,740 L 430,760 L 400,740 L 320,580 L 260,450 L 210,340 L 160,250 L 180,140 Z"
        fill="#0f172a" stroke="#1e3a5f" stroke-width="1.5" opacity="0.85" />

  <!-- Sub-basin highlight overlays -->
  <path d="M 280,130 Q 420,160 520,220 Q 640,260 670,300 L 550,310 L 400,250 Z" 
        fill="#0284c7" fill-opacity="0.08" stroke="#0284c7" stroke-width="0.7" stroke-dasharray="2,2"/>
  <path d="M 250,420 Q 380,440 540,490 L 460,560 Q 320,530 250,420 Z" 
        fill="#0d9488" fill-opacity="0.08" stroke="#0d9488" stroke-width="0.7" stroke-dasharray="2,2"/>

  <!-- ================= RIVER SYSTEMS (PATH TRACES) ================= -->

  <!-- 1. Ganga Mainstem & Tributaries -->
  <g class="river-system" id="system-ganga">
    <!-- Ganga Mainstem -->
    <path d="M 330,135 Q 360,180 430,220 T 540,260 T 630,285 T 675,325"
          fill="none" stroke="url(#gangaGrad)" stroke-width="5" stroke-linecap="round" class="river-trace" />
    <!-- Yamuna tributary -->
    <path d="M 310,130 Q 325,185 365,225 T 480,265 L 540,260"
          fill="none" stroke="url(#yamunaGrad)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1000" class="river-trace" />
    <!-- Gomti tributary -->
    <path d="M 400,195 Q 460,220 515,255"
          fill="none" stroke="#38bdf8" stroke-width="2.2" opacity="0.7" />
  </g>

  <!-- 2. Brahmaputra System -->
  <g class="river-system" id="system-brahmaputra">
    <path d="M 870,165 Q 820,180 770,210 T 710,255 T 670,315"
          fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" class="river-trace" />
  </g>

  <!-- 3. Sabarmati River -->
  <g class="river-system" id="system-sabarmati">
    <path d="M 240,300 Q 248,340 252,380"
          fill="none" stroke="#2dd4bf" stroke-width="2.8" stroke-linecap="round" class="river-trace" />
  </g>

  <!-- 4. Narmada System -->
  <g class="river-system" id="system-narmada">
    <path d="M 480,360 Q 390,370 310,380 L 255,395"
          fill="none" stroke="#22d3ee" stroke-width="3.8" stroke-linecap="round" class="river-trace" />
  </g>

  <!-- 5. Mahanadi System -->
  <g class="river-system" id="system-mahanadi">
    <path d="M 520,380 Q 570,385 620,400 T 670,410"
          fill="none" stroke="#38bdf8" stroke-width="3.2" stroke-linecap="round" class="river-trace" />
  </g>

  <!-- 6. Godavari System -->
  <g class="river-system" id="system-godavari">
    <path d="M 270,430 Q 380,450 480,470 T 580,505"
          fill="none" stroke="url(#peninsularGrad)" stroke-width="4" stroke-linecap="round" class="river-trace" />
  </g>

  <!-- 7. Krishna System -->
  <g class="river-system" id="system-krishna">
    <path d="M 290,520 Q 380,540 470,560 T 560,575"
          fill="none" stroke="url(#peninsularGrad)" stroke-width="3.6" stroke-linecap="round" class="river-trace" />
  </g>

  <!-- 8. Cauvery System -->
  <g class="river-system" id="system-cauvery">
    <path d="M 330,640 Q 400,660 460,675 T 510,685"
          fill="none" stroke="#2dd4bf" stroke-width="3.2" stroke-linecap="round" class="river-trace" />
  </g>

  <!-- ================= RIVER REACH LABELS ================= -->
  <g font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">
    <text x="380" y="195" fill="#38bdf8">Ganga Basin</text>
    <text x="290" y="210" fill="#67e8f9">Yamuna</text>
    <text x="750" y="190" fill="#38bdf8">Brahmaputra</text>
    <text x="350" y="355" fill="#22d3ee">Narmada</text>
    <text x="560" y="380" fill="#38bdf8">Mahanadi</text>
    <text x="390" y="445" fill="#2dd4bf">Godavari</text>
    <text x="380" y="535" fill="#2dd4bf">Krishna</text>
    <text x="380" y="650" fill="#2dd4bf">Cauvery</text>
    <text x="210" y="330" fill="#2dd4bf">Sabarmati</text>
  </g>

  <!-- ================= INTERACTIVE MONITORING NODES ================= -->

  <!-- Ganga - Haridwar (Good) -->
  <g class="river-station" data-river-id="ganga-haridwar" transform="translate(330,135)">
    <circle r="14" fill="#10b981" fill-opacity="0.2" class="node-pulse" />
    <circle r="7" fill="#10b981" stroke="#ffffff" stroke-width="2" class="river-node node-good" id="node-ganga-haridwar" />
    <text x="12" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Haridwar</text>
  </g>

  <!-- Yamuna - Delhi (Severely Degraded) -->
  <g class="river-station" data-river-id="yamuna-delhi" transform="translate(325,185)">
    <circle r="18" fill="#ef4444" fill-opacity="0.3" class="node-pulse alert-pulse" />
    <circle r="8" fill="#ef4444" stroke="#ffffff" stroke-width="2" class="river-node node-critical" id="node-yamuna-delhi" />
    <text x="-48" y="-12" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f87171">Delhi (Okhla)</text>
  </g>

  <!-- Yamuna - Agra (Severely Degraded) -->
  <g class="river-station" data-river-id="yamuna-agra" transform="translate(365,225)">
    <circle r="15" fill="#ef4444" fill-opacity="0.25" class="node-pulse alert-pulse" />
    <circle r="7.5" fill="#ef4444" stroke="#ffffff" stroke-width="2" class="river-node node-critical" id="node-yamuna-agra" />
    <text x="12" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fca5a5">Agra</text>
  </g>

  <!-- Ganga - Kanpur (Severely Degraded) -->
  <g class="river-station" data-river-id="ganga-kanpur" transform="translate(430,220)">
    <circle r="16" fill="#ef4444" fill-opacity="0.25" class="node-pulse alert-pulse" />
    <circle r="7.5" fill="#ef4444" stroke="#ffffff" stroke-width="2" class="river-node node-critical" id="node-ganga-kanpur" />
    <text x="12" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f87171">Kanpur (Jajmau)</text>
  </g>

  <!-- Ganga - Varanasi (Polluted) -->
  <g class="river-station" data-river-id="ganga-varanasi" transform="translate(540,260)">
    <circle r="16" fill="#f59e0b" fill-opacity="0.25" class="node-pulse" />
    <circle r="8" fill="#f59e0b" stroke="#ffffff" stroke-width="2" class="river-node node-polluted" id="node-ganga-varanasi" />
    <text x="12" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">Varanasi</text>
  </g>

  <!-- Ganga - Patna (Moderate) -->
  <g class="river-station" data-river-id="ganga-patna" transform="translate(630,285)">
    <circle r="14" fill="#3b82f6" fill-opacity="0.2" class="node-pulse" />
    <circle r="7" fill="#3b82f6" stroke="#ffffff" stroke-width="2" class="river-node node-moderate" id="node-ganga-patna" />
    <text x="12" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#93c5fd">Patna</text>
  </g>

  <!-- Brahmaputra - Guwahati (Moderate) -->
  <g class="river-station" data-river-id="brahmaputra-guwahati" transform="translate(770,210)">
    <circle r="14" fill="#3b82f6" fill-opacity="0.2" class="node-pulse" />
    <circle r="7" fill="#3b82f6" stroke="#ffffff" stroke-width="2" class="river-node node-moderate" id="node-brahmaputra-guwahati" />
    <text x="12" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#93c5fd">Guwahati</text>
  </g>

  <!-- Sabarmati - Ahmedabad (Severely Degraded) -->
  <g class="river-station" data-river-id="sabarmati-ahmedabad" transform="translate(250,360)">
    <circle r="15" fill="#ef4444" fill-opacity="0.25" class="node-pulse alert-pulse" />
    <circle r="7.5" fill="#ef4444" stroke="#ffffff" stroke-width="2" class="river-node node-critical" id="node-sabarmati-ahmedabad" />
    <text x="-78" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f87171">Ahmedabad</text>
  </g>

  <!-- Narmada - Jabalpur (Good) -->
  <g class="river-station" data-river-id="narmada-jabalpur" transform="translate(450,365)">
    <circle r="14" fill="#10b981" fill-opacity="0.2" class="node-pulse" />
    <circle r="7" fill="#10b981" stroke="#ffffff" stroke-width="2" class="river-node node-good" id="node-narmada-jabalpur" />
    <text x="12" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#a7f3d0">Jabalpur</text>
  </g>

  <!-- Mahanadi - Cuttack (Good) -->
  <g class="river-station" data-river-id="mahanadi-cuttack" transform="translate(650,405)">
    <circle r="14" fill="#10b981" fill-opacity="0.2" class="node-pulse" />
    <circle r="7" fill="#10b981" stroke="#ffffff" stroke-width="2" class="river-node node-good" id="node-mahanadi-cuttack" />
    <text x="12" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#a7f3d0">Cuttack</text>
  </g>

  <!-- Godavari - Nashik (Moderate) -->
  <g class="river-station" data-river-id="godavari-nashik" transform="translate(270,430)">
    <circle r="14" fill="#3b82f6" fill-opacity="0.2" class="node-pulse" />
    <circle r="7" fill="#3b82f6" stroke="#ffffff" stroke-width="2" class="river-node node-moderate" id="node-godavari-nashik" />
    <text x="-48" y="-10" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#93c5fd">Nashik</text>
  </g>

  <!-- Godavari - Rajahmundry (Moderate) -->
  <g class="river-station" data-river-id="godavari-rajahmundry" transform="translate(580,505)">
    <circle r="14" fill="#3b82f6" fill-opacity="0.2" class="node-pulse" />
    <circle r="7" fill="#3b82f6" stroke="#ffffff" stroke-width="2" class="river-node node-moderate" id="node-godavari-rajahmundry" />
    <text x="12" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#93c5fd">Rajahmundry</text>
  </g>

  <!-- Krishna - Vijayawada (Moderate) -->
  <g class="river-station" data-river-id="krishna-vijayawada" transform="translate(560,575)">
    <circle r="14" fill="#3b82f6" fill-opacity="0.2" class="node-pulse" />
    <circle r="7" fill="#3b82f6" stroke="#ffffff" stroke-width="2" class="river-node node-moderate" id="node-krishna-vijayawada" />
    <text x="12" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#93c5fd">Vijayawada</text>
  </g>

  <!-- Cauvery - Tiruchirappalli (Moderate) -->
  <g class="river-station" data-river-id="kaveri-tiruchi" transform="translate(460,675)">
    <circle r="14" fill="#3b82f6" fill-opacity="0.2" class="node-pulse" />
    <circle r="7" fill="#3b82f6" stroke="#ffffff" stroke-width="2" class="river-node node-moderate" id="node-kaveri-tiruchi" />
    <text x="12" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#93c5fd">Tiruchirappalli</text>
  </g>

  <!-- ================= MAP LEGEND & WATER QUALITY TIERS ================= -->
  <g transform="translate(40, 680)" filter="url(#shadow)">
    <rect width="270" height="110" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
    <text x="16" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">River Basin Health Index</text>

    <!-- Legend Items -->
    <circle cx="26" cy="45" r="5" fill="#10b981" />
    <text x="40" y="49" font-family="system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">Good (Index 75–100)</text>

    <circle cx="26" cy="65" r="5" fill="#3b82f6" />
    <text x="40" y="69" font-family="system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">Moderate (Index 55–74)</text>

    <circle cx="26" cy="85" r="5" fill="#f59e0b" />
    <text x="40" y="89" font-family="system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">Polluted (Index 35–54)</text>

    <circle cx="156" cy="85" r="5" fill="#ef4444" />
    <text x="170" y="89" font-family="system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">Critical (&lt; 35)</text>
  </g>

  <!-- Title Watermark -->
  <g transform="translate(50, 45)">
    <text font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#38bdf8" letter-spacing="1">जनशक्ति RIVER BASIN MONITOR</text>
    <text y="20" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Real-time Citizen &amp; Hydro-telemetry Observability</text>
  </g>
</svg>
